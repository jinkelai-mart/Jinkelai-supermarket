<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jinkelai Supermarket</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100 pb-20">

  <!-- Header ជាមួយ Logo & Cart Icon -->
  <header class="bg-emerald-800 text-white p-4 sticky top-0 z-40 shadow-md">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-white rounded-full flex items-center justify-center text-emerald-800 font-bold text-xl shadow">
          🛒
        </div>
        <div>
          <h1 class="font-bold text-lg leading-tight">Jinkelai Supermarket</h1>
          <p class="text-xs text-emerald-200">ផ្សារទំនើប ជិនកើឡាយ</p>
        </div>
      </div>

      <button onclick="toggleCartModal()" class="relative bg-emerald-700 hover:bg-emerald-600 px-4 py-2 rounded-lg flex items-center gap-2 transition">
        <i class="fas fa-shopping-cart text-lg"></i>
        <span class="font-bold">កន្ត្រក</span>
        <span id="cartCount" class="bg-red-500 text-white text-xs font-bold px-2 py-0.5 rounded-full">0</span>
      </button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-6xl mx-auto p-4">
    <h2 class="text-xl font-bold mb-4 text-gray-800">🛍️ ទំនិញទាំងអស់</h2>
    <div id="productGrid" class="grid grid-cols-2 md:grid-cols-4 gap-4">
      <div class="col-span-full text-center py-10 text-gray-500">កំពុងទាញយកទំនិញ...</div>
    </div>
  </main>

  <!-- Cart & Checkout Modal -->
  <div id="cartModal" class="fixed inset-0 bg-black/50 z-50 hidden flex justify-end">
    <div class="bg-white w-full max-w-md h-full p-4 flex flex-col justify-between shadow-2xl overflow-y-auto">
      <div>
        <div class="flex justify-between items-center border-b pb-3 mb-4">
          <h3 class="text-lg font-bold text-gray-800"><i class="fas fa-shopping-bag mr-2 text-emerald-700"></i>កន្ត្រក និងព័ត៌មានដឹកជញ្ជូន</h3>
          <button onclick="toggleCartModal()" class="text-gray-500 hover:text-red-500 text-xl font-bold">&times;</button>
        </div>
        
        <!-- Form ព័ត៌មានអតិថិជន -->
        <div class="mb-4 space-y-2">
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">ឈ្មោះអ្នកទិញ *</label>
            <input type="text" id="custName" placeholder="ឧ. សុខ ជា" class="w-full border p-2 rounded text-sm focus:ring-2 focus:ring-emerald-500">
          </div>
          
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">លេខទូរស័ព្ទ *</label>
            <input type="tel" id="custPhone" placeholder="ឧ. 012 345 678" class="w-full border p-2 rounded text-sm focus:ring-2 focus:ring-emerald-500">
          </div>

          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">អាសយដ្ឋានដឹកជញ្ជូន *</label>
            <textarea id="custAddress" rows="2" placeholder="ផ្ទះលេខ... ផ្លូវ... ខណ្ឌ/ស្រុក..." class="w-full border p-2 rounded text-sm focus:ring-2 focus:ring-emerald-500"></textarea>
          </div>

          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">រូបភាពទីតាំង/Map (Option)</label>
            <input type="file" id="locImageFile" accept="image/*" onchange="previewLocImg(event)" class="w-full border p-1 rounded text-xs">
            <img id="locPreview" class="mt-1 h-20 object-cover rounded hidden">
          </div>

          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">វិធីសាស្ត្របង់ប្រាក់ *</label>
            <select id="payMethod" class="w-full border p-2 rounded text-sm focus:ring-2 focus:ring-emerald-500">
              <option value="បង់ប្រាក់ជាមួយអ្នកដឹកជញ្ជូន (COD)">💵 បង់ប្រាក់ជាមួយអ្នកដឹកជញ្ជូន (COD)</option>
              <option value="វេរប្រាក់តាមធនាគារ (ABA / KHQR)">💳 វេរប្រាក់តាមធនាគារ (ABA / KHQR)</option>
            </select>
          </div>
        </div>

        <hr class="my-3">
        <h4 class="font-bold text-sm mb-2 text-gray-700">📦 បញ្ជីទំនិញក្នុងកន្ត្រក</h4>
        <div id="cartItems" class="space-y-2 max-h-[30vh] overflow-y-auto pr-1"></div>
      </div>

      <div class="border-t pt-3 bg-gray-50 p-3 rounded-lg mt-4">
        <div class="flex justify-between font-bold text-lg mb-3">
          <span>សរុប (Total):</span>
          <span id="cartTotal" class="text-emerald-700">$0.00</span>
        </div>
        <button id="checkoutBtn" onclick="checkout()" class="w-full bg-emerald-700 text-white py-3 rounded-lg font-bold hover:bg-emerald-800 transition">
          ផ្ញើការបញ្ជាទិញ (Order Now)
        </button>
      </div>
    </div>
  </div>

  <!-- Firebase Setup & Telegram Config -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // ១. Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyBMeERdMiNIhctpNGReM8nHIVHfweQfaDE",
      authDomain: "jinkelai-supermarket-e4786.firebaseapp.com",
      projectId: "jinkelai-supermarket-e4786",
      storageBucket: "jinkelai-supermarket-e4786.firebasestorage.app",
      messagingSenderId: "345735387486",
      appId: "1:345735387486:web:44fc724756c3b77a7617cf",
      measurementId: "G-P0G4RNKKMG"
    };

    // ២. Telegram Configuration (ដាក់ Bot Token និង Chat ID របស់បង)
    const TELEGRAM_BOT_TOKEN = "7832628795:AAHQ_YOUR_BOT_TOKEN_HERE"; 
    const TELEGRAM_CHAT_ID = "123456789"; 

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let cart = [];
    let productsList = [];
    let selectedLocBase64 = '';

    // Preview រូបភាពទីតាំង
    window.previewLocImg = function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          selectedLocBase64 = evt.target.result;
          const img = document.getElementById('locPreview');
          img.src = selectedLocBase64;
          img.classList.remove('hidden');
        };
        reader.readAsDataURL(file);
      }
    };

    async function loadProducts() {
      const grid = document.getElementById('productGrid');
      try {
        const querySnapshot = await getDocs(collection(db, 'products'));
        grid.innerHTML = '';
        productsList = [];

        if (querySnapshot.empty) {
          grid.innerHTML = '<div class="col-span-full text-center py-10 text-gray-500">មិនទាន់មានទំនិញនៅឡើយទេ</div>';
          return;
        }

        querySnapshot.forEach((docSnap) => {
          const p = { id: docSnap.id, ...docSnap.data() };
          productsList.push(p);

          grid.innerHTML += `
            <div class="bg-white rounded-xl shadow p-3 flex flex-col justify-between border hover:shadow-lg transition">
              <div>
                <img src="${p.image || 'https://via.placeholder.com/150'}" class="w-full h-36 object-cover rounded-lg mb-2">
                <h3 class="font-bold text-gray-800 line-clamp-1">${p.name_km}</h3>
                <p class="text-xs text-gray-400 line-clamp-1">${p.name_en || ''}</p>
              </div>
              <div class="mt-3">
                <div class="flex justify-between items-center mb-2">
                  <span class="text-emerald-700 font-bold">$${p.price.toFixed(2)}</span>
                  <span class="text-xs text-gray-500">ស្តុក: ${p.stock}</span>
                </div>
                <button onclick="addToCart('${p.id}')" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white py-1.5 rounded-lg text-sm font-bold flex items-center justify-center gap-2">
                  <i class="fas fa-cart-plus"></i> បញ្ចូលកន្ត្រក
                </button>
              </div>
            </div>
          `;
        });
      } catch (err) {
        grid.innerHTML = '<div class="col-span-full text-center text-red-500">មានបញ្ហា៖ ' + err.message + '</div>';
      }
    }

    window.addToCart = function(id) {
      const product = productsList.find(p => p.id === id);
      if (!product) return;

      const existing = cart.find(item => item.id === id);
      if (existing) {
        existing.qty += 1;
      } else {
        cart.push({ ...product, qty: 1 });
      }
      updateCartUI();
    };

    window.updateCartUI = function() {
      const cartItemsContainer = document.getElementById('cartItems');
      const cartCount = document.getElementById('cartCount');
      const cartTotal = document.getElementById('cartTotal');

      cartItemsContainer.innerHTML = '';
      let total = 0;
      let totalQty = 0;

      if (cart.length === 0) {
        cartItemsContainer.innerHTML = '<div class="text-center py-4 text-gray-400 text-sm">គ្មានទំនិញក្នុងកន្ត្រកទេ</div>';
      } else {
        cart.forEach(item => {
          const itemTotal = item.price * item.qty;
          total += itemTotal;
          totalQty += item.qty;

          cartItemsContainer.innerHTML += `
            <div class="flex justify-between items-center p-2 border-b">
              <div class="flex items-center gap-2">
                <img src="${item.image}" class="w-8 h-8 object-cover rounded">
                <div>
                  <div class="font-bold text-xs line-clamp-1">${item.name_km}</div>
                  <div class="text-[10px] text-emerald-700">$${item.price.toFixed(2)} x ${item.qty}</div>
                </div>
              </div>
              <div class="flex items-center gap-1">
                <button onclick="changeQty('${item.id}', -1)" class="w-5 h-5 bg-gray-200 rounded font-bold text-xs">-</button>
                <span class="text-xs font-bold px-1">${item.qty}</span>
                <button onclick="changeQty('${item.id}', 1)" class="w-5 h-5 bg-gray-200 rounded font-bold text-xs">+</button>
              </div>
            </div>
          `;
        });
      }

      cartCount.innerText = totalQty;
      cartTotal.innerText = `$${total.toFixed(2)}`;
    };

    window.changeQty = function(id, delta) {
      const item = cart.find(i => i.id === id);
      if (item) {
        item.qty += delta;
        if (item.qty <= 0) {
          cart = cart.filter(i => i.id !== id);
        }
      }
      updateCartUI();
    };

    window.toggleCartModal = function() {
      document.getElementById('cartModal').classList.toggle('hidden');
    };

    // មុខងារផ្ញើការបញ្ជាទិញទៅ Telegram
    window.checkout = async function() {
      const name = document.getElementById('custName').value.trim();
      const phone = document.getElementById('custPhone').value.trim();
      const address = document.getElementById('custAddress').value.trim();
      const payMethod = document.getElementById('payMethod').value;

      if (cart.length === 0) return alert('សូមជ្រើសរើសទំនិញមុននឹងទូទាត់!');
      if (!name || !phone || !address) return alert('សូមបំពេញឈ្មោះ, លេខទូរស័ព្ទ និងអាសយដ្ឋានឱ្យបានគ្រប់!');

      const btn = document.getElementById('checkoutBtn');
      btn.innerText = 'កំពុងផ្ញើការបញ្ជាទិញ...';
      btn.disabled = true;

      let totalAmount = 0;
      let orderListText = '';
      
      cart.forEach((item, index) => {
        const itemTotal = item.price * item.qty;
        totalAmount += itemTotal;
        orderListText += `${index + 1}. ${item.name_km} x ${item.qty} = $${itemTotal.toFixed(2)}\n`;
      });

      const message = `🛒 *ការបញ្ជាទិញថ្មី - JINKELAI* 🛒\n` +
                      `-----------------------------\n` +
                      `👤 *ឈ្មោះ:* ${name}\n` +
                      `📞 *ទូរស័ព្ទ:* ${phone}\n` +
                      `📍 *អាសយដ្ឋាន:* ${address}\n` +
                      `💳 *ការបង់ប្រាក់:* ${payMethod}\n` +
                      `-----------------------------\n` +
                      `📦 *បញ្ជីទំនិញ:*\n${orderListText}` +
                      `-----------------------------\n` +
                      `💰 *សរុប (TOTAL):* $${totalAmount.toFixed(2)}`;

      try {
        // ផ្ញើសារអក្សរទៅ Telegram
        const res = await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            chat_id: TELEGRAM_CHAT_ID,
            text: message,
            parse_mode: 'Markdown'
          })
        });

        // បើមាន Upload រូបភាពទីតាំង វានឹងផ្ញើរូបភាពទៅ Telegram ថែមទៀត
        if (selectedLocBase64) {
          const blob = await (await fetch(selectedLocBase64)).blob();
          const formData = new FormData();
          formData.append('chat_id', TELEGRAM_CHAT_ID);
          formData.append('photo', blob, 'location.jpg');
          formData.append('caption', `📍 រូបភាពទីតាំងរបស់អតិថិជន៖ ${name}`);

          await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto`, {
            method: 'POST',
            body: formData
          });
        }

        if (res.ok) {
          alert('🎉 ការបញ្ជាទិញត្រូវបានផ្ញើទៅកាន់ Telegram រួចរាល់!');
          cart = [];
          document.getElementById('custName').value = '';
          document.getElementById('custPhone').value = '';
          document.getElementById('custAddress').value = '';
          document.getElementById('locImageFile').value = '';
          document.getElementById('locPreview').classList.add('hidden');
          selectedLocBase64 = '';
          updateCartUI();
          toggleCartModal();
        } else {
          alert('មានបញ្ហាក្នុងការផ្ញើ! សូមពិនិត្យ Bot Token/Chat ID ឡើងវិញ។');
        }
      } catch (err) {
        alert('មានបញ្ហា៖ ' + err.message);
      } finally {
        btn.innerText = 'ផ្ញើការបញ្ជាទិញ (Order Now)';
        btn.disabled = false;
      }
    };

    loadProducts();
  </script>
</body>
</html>
