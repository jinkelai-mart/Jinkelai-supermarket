<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jinkelai Supermarket</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;600;700&display=swap');
        body { font-family: 'Kantumruy Pro', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 flex flex-col min-h-screen">

    <header class="bg-green-700 text-white shadow-md sticky top-0 z-50">
        <div class="container mx-auto px-4 py-3 flex flex-wrap md:flex-nowrap justify-between items-center gap-3">
            <div class="flex items-center space-x-2 shrink-0">
                <i class="fa-solid fa-cart-shopping text-2xl"></i>
                <div>
                    <h1 class="text-lg font-bold leading-tight">Jinkelai Supermarket</h1>
                    <p class="text-[10px] text-green-200">ផ្សារទំនើប ជិនកើឡាយ</p>
                </div>
            </div>

            <div class="w-full md:w-1/2 order-3 md:order-2">
                <div class="relative w-full">
                    <input type="text" id="searchInput" oninput="filterProducts()" placeholder="ស្វែងរកមុខទំនិញ..." class="w-full pl-10 pr-4 py-1.5 rounded-full text-sm text-gray-800 bg-white border-0 outline-none focus:ring-2 focus:ring-yellow-400">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-gray-400 text-sm"></i>
                </div>
            </div>

            <div class="flex items-center space-x-2 order-2 md:order-3 shrink-0 ml-auto md:ml-0">
                <select id="langSelect" onchange="changeLanguage(this.value)" class="bg-green-800 text-white text-xs rounded px-2 py-1 outline-none border border-green-600">
                    <option value="km">🇰🇭 ខ្មែរ</option>
                    <option value="en">🇬🇧 EN</option>
                    <option value="zh">🇨🇳 中文</option>
                </select>
                
                <button onclick="toggleCartModal()" class="relative bg-green-800 hover:bg-green-900 px-3 py-1.5 rounded-lg flex items-center space-x-1 transition text-xs font-semibold">
                    <i class="fa-solid fa-basket-shopping"></i>
                    <span id="cartBadge" class="bg-yellow-400 text-green-900 font-bold rounded-full px-1.5 py-0.5 ml-1">0</span>
                </button>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-4 py-6 flex-grow">
        <div class="flex justify-between items-center mb-4">
            <h3 data-i18n="productsList" class="text-lg font-bold text-gray-800 border-l-4 border-green-600 pl-3">ទំនិញទាំងអស់</h3>
            <span id="productCount" class="text-xs text-gray-500">កំពុងផ្ទុក...</span>
        </div>
        
        <div id="productGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
        
        <div id="loadingSpinner" class="text-center py-12">
            <i class="fa-solid fa-spinner fa-spin text-4xl text-green-600 mb-2"></i>
            <p class="text-sm text-gray-500">កំពុងទាញទិន្នន័យ...</p>
        </div>

        <div id="noResults" class="hidden text-center py-12 text-gray-500">
            <i class="fa-solid fa-magnifying-glass text-4xl mb-2 text-gray-300"></i>
            <p data-i18n="noProductFound">មិនមានទំនិញដែលអ្នកកំពុងស្វែងរកទេ!</p>
        </div>
    </main>

    <div id="cartModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex justify-end">
        <div class="bg-white w-full max-w-lg h-full shadow-2xl flex flex-col overflow-hidden">
            <div class="bg-green-700 text-white px-4 py-3 flex justify-between items-center">
                <h3 data-i18n="cartTitle" class="font-bold text-base"><i class="fa-solid fa-cart-shopping mr-2"></i>កន្ត្រកទំនិញ និងការទូទាត់</h3>
                <button onclick="toggleCartModal()" class="text-white text-xl font-bold">&times;</button>
            </div>

            <div class="p-4 overflow-y-auto flex-grow space-y-6">
                <div>
                    <h4 data-i18n="selectedItems" class="font-semibold text-gray-700 mb-2 border-b pb-1 text-sm">មុខទំនិញដែលបានជ្រើសរើស</h4>
                    <div id="cartItems" class="space-y-3"></div>
                    <div class="flex justify-between items-center mt-4 pt-2 border-t font-bold text-base">
                        <span data-i18n="totalAmount">សរុប (Total):</span>
                        <span id="cartTotal" class="text-green-700">$0.00</span>
                    </div>
                </div>

                <div class="border-t pt-4">
                    <h4 data-i18n="khqrPayment" class="font-semibold text-gray-700 mb-2 text-sm">ទូទាត់តាម QR Code (KHQR)</h4>
                    <div class="bg-gray-50 border rounded-xl p-4 flex flex-col items-center justify-center">
                        <div class="bg-white p-2 border rounded-lg shadow-sm mb-2">
                            <img id="qrCodeImg" src="" alt="KHQR Payment" class="w-44 h-44 object-contain">
                        </div>
                        <span id="qrBankDisplay" class="font-bold text-sm text-gray-800">ABA KHQR</span>
                        <span class="text-xs text-gray-500">ឈ្មោះគណនី: <strong id="qrAccDisplay" class="text-gray-700">VUTHY YOL</strong></span>
                    </div>

                    <div class="mt-4">
                        <label data-i18n="uploadSlip" class="block text-xs font-semibold text-gray-700 mb-1">សូម Upload រូបភាព Slip បង្កាន់ដៃទូទាត់ប្រាក់ *</label>
                        <input type="file" id="slipInput" accept="image/*" class="w-full text-xs border rounded-lg p-1">
                    </div>
                </div>

                <div class="border-t pt-4 space-y-3">
                    <input type="text" id="custName" placeholder="ឈ្មោះអ្នកទទួល *" class="w-full border rounded-lg px-3 py-2 text-sm">
                    <input type="tel" id="custPhone" placeholder="លេខទូរស័ព្ទ *" class="w-full border rounded-lg px-3 py-2 text-sm">
                    <textarea id="custAddress" placeholder="អាសយដ្ឋានដឹកជញ្ជូន *" rows="2" class="w-full border rounded-lg px-3 py-2 text-sm"></textarea>
                </div>
            </div>

            <div class="p-4 bg-gray-50 border-t">
                <button id="btnSubmitOrder" onclick="submitOrder()" class="w-full bg-green-700 hover:bg-green-800 text-white font-bold py-3 rounded-xl shadow-lg transition">
                    <span id="btnText" data-i18n="confirmOrder">បញ្ជាក់ការកុម្ម៉ង់</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        var TELEGRAM_BOT_TOKEN = "8893890936:AAGAozKmFRYbKEn9ubZnyCL5tajJE2OoTmw";
        var TELEGRAM_CHAT_ID = "1138406730";

        var firebaseConfig = {
            apiKey: "AIzaSyBMeERdMiNIhctpNGReM8nHIVHfweQfaDE",
            authDomain: "jinkelai-supermarket-e4786.firebaseapp.com",
            projectId: "jinkelai-supermarket-e4786",
            storageBucket: "jinkelai-supermarket-e4786.firebasestorage.app",
            messagingSenderId: "345735387486",
            appId: "1:345735387486:web:44fc724756c3b77a7617cf",
            measurementId: "G-P0G4RNKKMG"
        };

        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        var db = firebase.firestore();

        var products = [];
        var cart = [];
        var currentLang = 'km';

        var i18n = {
            km: { searchPlaceholder: "ស្វែងរកមុខទំនិញ...", cart: "កន្ត្រក", productsList: "ទំនិញទាំងអស់", addToCart: "បញ្ជូលកន្ត្រក", cartTitle: "កន្ត្រកទំនិញ និងការទូទាត់", selectedItems: "មុខទំនិញដែលបានជ្រើសរើស", totalAmount: "សរុប (Total):", khqrPayment: "ទូទាត់តាម QR Code (KHQR)", uploadSlip: "សូម Upload រូបភាព Slip បង្កាន់ដៃទូទាត់ប្រាក់ *", confirmOrder: "បញ្ជាក់ការកុម្ម៉ង់", sendingOrder: "កំពុងផ្ញើបទបញ្ជា...", emptyCart: "កន្ត្រកទំនិញរបស់អ្នកទទេស្អាត!", fillAllFields: "សូមបំពេញព័ត៌មាន និង Upload Slip ឲ្យគ្រប់!", orderSuccess: "ការកុម្ម៉ង់បានជោគជ័យ!", orderFailed: "មានបញ្ហាក្នុងការផ្ញើ!", noProductFound: "មិនមានទំនិញដែលអ្នកកំពុងស្វែងរកទេ!" },
            en: { searchPlaceholder: "Search products...", cart: "Cart", productsList: "All Products", addToCart: "Add to Cart", cartTitle: "Shopping Cart & Checkout", selectedItems: "Selected Items", totalAmount: "Total:", khqrPayment: "Pay via KHQR Code", uploadSlip: "Please Upload Payment Slip Image *", confirmOrder: "Confirm Order", sendingOrder: "Sending Order...", emptyCart: "Your cart is empty!", fillAllFields: "Please fill all details and upload slip!", orderSuccess: "Order placed successfully!", orderFailed: "Failed to send order!", noProductFound: "No products found!" },
            zh: { searchPlaceholder: "搜索商品...", cart: "购物车", productsList: "所有商品", addToCart: "加入购物车", cartTitle: "购物车与结账", selectedItems: "已选商品", totalAmount: "总计:", khqrPayment: "KHQR 扫码支付", uploadSlip: "请上传付款凭证截图 *", confirmOrder: "确认订单", sendingOrder: "正在发送订单...", emptyCart: "您的购物车是空的！", fillAllFields: "请填写完整信息并上传凭证！", orderSuccess: "下单成功！", orderFailed: "发送订单失败！", noProductFound: "未找到相关商品！" }
        };

        document.addEventListener("DOMContentLoaded", function() {
            fetchProductsFromFirebase();
            fetchQRSettings();
        });

        function fetchProductsFromFirebase() {
            db.collection("products").onSnapshot(function(snapshot) {
                products = [];
                snapshot.forEach(function(doc) {
                    var data = doc.data();
                    products.push({
                        id: doc.id,
                        name_km: data.name_km || data.name || "គ្មានឈ្មោះ",
                        name_en: data.name_en || data.name || "",
                        name_zh: data.name_zh || data.name || "",
                        price: parseFloat(data.price) || 0,
                        img: data.img || data.image_url || "https://via.placeholder.com/150"
                    });
                });
                document.getElementById('loadingSpinner').classList.add('hidden');
                renderProducts(products);
                updateCartUI();
            });
        }

        function fetchQRSettings() {
            db.collection("settings").doc("payment").onSnapshot(function(doc) {
                if (doc.exists && doc.data().qr_code_url) {
                    document.getElementById('qrCodeImg').src = doc.data().qr_code_url;
                    if(doc.data().bank_name) document.getElementById('qrBankDisplay').innerText = doc.data().bank_name;
                    if(doc.data().acc_name) document.getElementById('qrAccDisplay').innerText = doc.data().acc_name;
                }
            });
        }

        function changeLanguage(lang) {
            currentLang = lang;
            document.querySelectorAll('[data-i18n]').forEach(function(el) {
                var key = el.getAttribute('data-i18n');
                if (i18n[lang] && i18n[lang][key]) el.innerText = i18n[lang][key];
            });
            document.getElementById('searchInput').placeholder = i18n[lang].searchPlaceholder;
            filterProducts(); 
            renderCartItems();
        }

        function filterProducts() {
            var query = document.getElementById('searchInput').value.toLowerCase().trim();
            var filtered = products.filter(function(p) {
                return (p.name_km || "").toLowerCase().indexOf(query) !== -1 || 
                       (p.name_en || "").toLowerCase().indexOf(query) !== -1 || 
                       (p.name_zh || "").toLowerCase().indexOf(query) !== -1;
            });
            renderProducts(filtered);
        }

        function renderProducts(productList) {
            var grid = document.getElementById('productGrid');
            var noResults = document.getElementById('noResults');
            document.getElementById('productCount').innerText = "ចំនួនសរុប៖ " + productList.length;

            if (productList.length === 0) {
                grid.innerHTML = "";
                noResults.classList.remove('hidden');
                return;
            }

            noResults.classList.add('hidden');
            grid.innerHTML = productList.map(function(p) {
                var displayName = p['name_' + currentLang] || p.name_km;
                return '<div class="bg-white rounded-xl border p-3 flex flex-col justify-between hover:shadow-md transition">' +
                    '<div>' +
                        '<img src="' + p.img + '" class="w-full h-36 object-cover rounded-lg mb-2 bg-gray-100" onerror="this.src=\'https://via.placeholder.com/150\'">' +
                        '<h4 class="font-semibold text-xs text-gray-800 mb-1 line-clamp-2">' + displayName + '</h4>' +
                        '<div class="text-green-700 font-bold text-sm">$' + p.price.toFixed(2) + '</div>' +
                    '</div>' +
                    '<button onclick="addToCart(\'' + p.id + '\')" class="mt-3 w-full bg-green-50 hover:bg-green-100 text-green-700 font-semibold py-1.5 rounded-lg text-xs border border-green-200 flex items-center justify-center transition">' +
                        '<i class="fa-solid fa-cart-plus mr-1"></i> ' + i18n[currentLang].addToCart +
                    '</button>' +
                '</div>';
            }).join('');
        }

        function addToCart(id) {
            var item = cart.find(function(i) { return i.id === id; });
            if (item) {
                item.qty++;
            } else {
                var prod = products.find(function(p) { return p.id === id; });
                if (prod) cart.push(Object.assign({}, prod, { qty: 1 }));
            }
            updateCartUI();
        }

        function updateCartUI() {
            var totalCount = cart.reduce(function(s, i) { return s + i.qty; }, 0);
            document.getElementById('cartBadge').innerText = totalCount;
            renderCartItems();
        }

        function renderCartItems() {
            var container = document.getElementById('cartItems');
            if (cart.length === 0) {
                container.innerHTML = '<p class="text-gray-400 text-center py-4 text-sm">' + i18n[currentLang].emptyCart + '</p>';
                document.getElementById('cartTotal').innerText = "$0.00";
                return;
            }
            var total = 0;
            container.innerHTML = cart.map(function(item) {
                total += item.price * item.qty;
                var displayName = item['name_' + currentLang] || item.name_km;
                return '<div class="flex justify-between items-center border-b pb-2">' +
                    '<div>' +
                        '<div class="font-semibold text-xs">' + displayName + '</div>' +
                        '<div class="text-xs text-gray-500">$' + item.price.toFixed(2) + ' x ' + item.qty + '</div>' +
                    '</div>' +
                    '<span class="text-xs font-semibold text-green-700">x' + item.qty + '</span>' +
                '</div>';
            }).join('');
            document.getElementById('cartTotal').innerText = '$' + total.toFixed(2);
        }

        function toggleCartModal() {
            document.getElementById('cartModal').classList.toggle('hidden');
        }

        function submitOrder() {
            var name = document.getElementById('custName').value.trim();
            var phone = document.getElementById('custPhone').value.trim();
            var address = document.getElementById('custAddress').value.trim();
            var slipFile = document.getElementById('slipInput').files[0];

            if (cart.length === 0) return alert(i18n[currentLang].emptyCart);
            if (!name || !phone || !address || !slipFile) return alert(i18n[currentLang].fillAllFields);

            var btn = document.getElementById('btnSubmitOrder');
            var btnText = document.getElementById('btnText');
            btn.disabled = true; 
            btnText.innerText = i18n[currentLang].sendingOrder;

            var totalAmount = cart.reduce(function(s, i) { return s + (i.price * i.qty); }, 0);
            var orderDetails = cart.map(function(i) { return '• ' + i.name_km + ' x' + i.qty + ' = $' + (i.price * i.qty).toFixed(2); }).join('\n');
            var caption = '🛒 **រាយការណ៍ការកុម្ម៉ង់ថ្មី**\n--------------------------\n👤 **ឈ្មោះ:** ' + name + '\n📞 **ទូរស័ព្ទ:** ' + phone + '\n📍 **អាសយដ្ឋាន:** ' + address + '\n\n📦 **មុខទំនិញ:**\n' + orderDetails + '\n--------------------------\n💰 **សរុប:** $' + totalAmount.toFixed(2);

            var formData = new FormData();
            formData.append('chat_id', TELEGRAM_CHAT_ID);
            formData.append('photo', slipFile);
            formData.append('caption', caption);
            formData.append('parse_mode', 'Markdown');

            fetch('https://api.telegram.org/bot' + TELEGRAM_BOT_TOKEN + '/sendPhoto', { method: 'POST', body: formData })
            .then(function(res) { return res.json(); })
            .then(function(result) {
                if (result.ok) {
                    alert(i18n[currentLang].orderSuccess);
                    cart = []; 
                    updateCartUI(); 
                    toggleCartModal();
                } else {
                    alert(i18n[currentLang].orderFailed);
                }
            })
            .catch(function(err) {
                alert(i18n[currentLang].orderFailed);
            })
            .then(function() {
                btn.disabled = false; 
                btnText.innerText = i18n[currentLang].confirmOrder;
            });
        }
    </script>
</body>
</html>
