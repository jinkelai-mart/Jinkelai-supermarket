<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jinkelai Supermarket</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100 pb-20">

  <!-- Header -->
  <header class="bg-emerald-800 text-white p-4 sticky top-0 z-40 shadow-md">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-white rounded-full flex items-center justify-center text-emerald-800 font-bold text-xl shadow">🛒</div>
        <div>
          <h1 class="font-bold text-lg leading-tight">Jinkelai Supermarket</h1>
          <p class="text-xs text-emerald-200" id="i18n-subtitle">ផ្សារទំនើប ជិនកើឡាយ</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <!-- Dropdown Selector 3 ភាសា (Full Support) -->
        <select id="langSelect" onchange="changeLanguage(this.value)" class="bg-emerald-700 hover:bg-emerald-600 text-white px-2 py-1.5 rounded-lg text-xs font-bold border border-emerald-500 focus:outline-none cursor-pointer">
          <option value="km">🇰🇭 ខ្មែរ</option>
          <option value="en">🇬🇧 English</option>
          <option value="zh">🇨🇳 中文</option>
        </select>

        <!-- ប៊ូតុងកន្ត្រកទំនិញ -->
        <button onclick="toggleCartModal()" class="relative bg-emerald-700 hover:bg-emerald-600 px-3 py-1.5 rounded-lg flex items-center gap-2 transition text-sm">
          <i class="fas fa-shopping-cart text-base"></i>
          <span class="font-bold hidden sm:inline" id="i18n-cartBtn">កន្ត្រក</span>
          <span id="cartCount" class="bg-red-500 text-white text-xs font-bold px-2 py-0.5 rounded-full">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-6xl mx-auto p-4">
    <div class="flex justify-between items-center mb-4">
      <h2 class="text-xl font-bold text-gray-800" id="i18n-mainTitle">🛍️ ទំនិញទាំងអស់</h2>
      <span class="text-xs text-gray-500 font-bold" id="i18n-productCount">ចំនួនទំនិញ៖ 0</span>
    </div>
    <div id="productGrid" class="grid grid-cols-2 md:grid-cols-4 gap-4">
      <div class="col-span-full text-center py-10 text-gray-500" id="i18n-loading">កំពុងទាញយកទំនិញ...</div>
    </div>
  </main>

      <div>
        <div class="flex justify-between items-center border-b pb-3 mb-4">
          <h3 class="text-lg font-bold text-gray-800">
            <i class="fas fa-shopping-bag mr-2 text-emerald-700"></i>
            <span id="i18n-modalTitle">កន្ត្រក និងព័ត៌មានដឹកជញ្ជូន</span>
          </h3>
          <button onclick="toggleCartModal()" class="text-gray-500 hover:text-red-500 text-xl font-bold">&times;</button>
        </div>
        
        <!-- Form ព័ត៌មានអតិថិជន -->

          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1" id="i18n-lblCustName">ឈ្មោះអ្នកទិញ *</label>
            <input type="text" id="custName" placeholder="ឧ. សុខ ជា" class="w-full border p-2 rounded text-sm focus:ring-2 focus:ring-emerald-500">
          </div>
          
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1" id="i18n-lblCustPhone">លេខទូរស័ព្ទ *</label>
            <input type="tel" id="custPhone" placeholder="ឧ. 012 345 678" class="w-full border p-2 rounded text-sm focus:ring-2 focus:ring-emerald-500">
          </div>

          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1" id="i18n-lblCustAddress">អាសយដ្ឋានដឹកជញ្ជូន *</label>
            <textarea id="custAddress" rows="2" placeholder="ផ្ទះលេខ... ផ្លូវ... ខណ្ឌ/ស្រុក..." class="w-full border p-2 rounded text-sm focus:ring-2 focus:ring-emerald-500"></textarea>
          </div>

          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1" id="i18n-lblPayMethod">វិធីសាស្ត្របង់ប្រាក់ *</label>
            <select id="payMethod" onchange="togglePaymentUI()" class="w-full border p-2 rounded text-sm focus:ring-2 focus:ring-emerald-500 font-bold">
              <option value="COD" id="i18n-optCOD">💵 បង់ប្រាក់ជាមួយអ្នកដឹកជញ្ជូន (COD)</option>
              <option value="KHQR" id="i18n-optKHQR">💳 ទូទាត់តាម QR Code (KHQR)</option>
            </select>
          </div>

          <!-- Section KHQR & Upload Slip -->

            <p class="text-xs font-bold text-emerald-900" id="i18n-scanNotice">សូមស្កេន QR Code ខាងក្រោមដើម្បីទូទាត់ប្រាក់៖</p>
            
            <img id="storeQrImg" src="https://pay.ababank.com/oRF8/d5yora7v" class="w-52 h-auto mx-auto rounded-lg shadow-md border bg-white p-1" alt="ABA KHQR">
            
            <p class="text-xs text-gray-700 font-bold">
              <span id="i18n-accNameLabel">ឈ្មោះគណនី៖</span> 
              <span class="text-emerald-800 font-extrabold">VUTHY YOL</span>
            </p>
            
            <hr class="my-2 border-emerald-200">
            <div class="text-left">
              <label class="block text-xs font-bold text-red-600 mb-1" id="i18n-lblUploadSlip">សូម Upload រូបភាព Slip វេរប្រាក់ *</label>
              <input type="file" id="paySlipFile" accept="image/*" onchange="previewSlip(event)" class="w-full border p-1 rounded text-xs bg-white">
              <img id="slipPreview" class="mt-2 h-28 object-cover rounded mx-auto hidden border" alt="Slip Preview">
            </div>
          </div>
        </div>

        <hr class="my-3">
        <h4 class="font-bold text-sm mb-2 text-gray-700" id="i18n-cartListTitle">📦 បញ្ជីទំនិញក្នុងកន្ត្រក</h4>
        <div id="cartItems" class="space-y-2 max-h-[25vh] overflow-y-auto pr-1"></div>
      </div>

      <div class="border-t pt-3 bg-gray-50 p-3 rounded-lg mt-4">
        <div class="flex justify-between font-bold text-lg mb-3">
          <span id="i18n-totalLabel">សរុប (Total):</span>
          <span id="cartTotal" class="text-emerald-700">$0.00</span>
        </div>
        <button id="checkoutBtn" onclick="checkout()" class="w-full bg-emerald-700 text-white py-3 rounded-lg font-bold hover:bg-emerald-800 transition shadow">
          <span id="i18n-checkoutBtn">ផ្ញើការបញ្ជាទិញ (Order Now)</span>
        </button>
      </div>
    </div>
  </div>

    window.changeLanguage = function(lang) {
      currentLang = lang;
      localStorage.setItem('app_lang', lang);
      document.getElementById('langSelect').value = lang;

      const t = dictionary[lang];
      document.getElementById('i18n-subtitle').innerText = t.subtitle;
      document.getElementById('i18n-cartBtn').innerText = t.cartBtn;
      document.getElementById('i18n-mainTitle').innerText = t.mainTitle;
      document.getElementById('i18n-modalTitle').innerText = t.modalTitle;
      
      document.getElementById('i18n-lblCustName').innerText = t.lblCustName;
      document.getElementById('custName').placeholder = t.custNamePh;
      document.getElementById('i18n-lblCustPhone').innerText = t.lblCustPhone;
      document.getElementById('custPhone').placeholder = t.custPhonePh;
      document.getElementById('i18n-lblCustAddress').innerText = t.lblCustAddress;
      document.getElementById('custAddress').placeholder = t.custAddressPh;
      
      document.getElementById('i18n-lblPayMethod').innerText = t.lblPayMethod;

      document.getElementById('i18n-optKHQR').innerText = t.optKHQR;

      document.getElementById('i18n-lblUploadSlip').innerText = t.lblUploadSlip;
      document.getElementById('i18n-cartListTitle').innerText = t.cartListTitle;
      document.getElementById('i18n-totalLabel').innerText = t.totalLabel;

      renderProducts();
      updateCartUI();
    };

    window.togglePaymentUI = function() {
      const payMethod = document.getElementById('payMethod').value;
      const qrSection = document.getElementById('qrSection');
      if (payMethod === 'KHQR') {
        qrSection.classList.remove('hidden');
      } else {
        qrSection.classList.add('hidden');
      }
    };

    window.previewSlip = function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          selectedSlipBase64 = evt.target.result;
          const img = document.getElementById('slipPreview');
          img.src = selectedSlipBase64;
          img.classList.remove('hidden');
        };
        reader.readAsDataURL(file);
      }
    };

    async function loadProducts() {
      try {
        const querySnapshot = await getDocs(collection(db, 'products'));
        productsList = [];

        if (querySnapshot.empty) {
          document.getElementById('productGrid').innerHTML = `<div class="col-span-full text-center py-10 text-gray-500">${dictionary[currentLang].emptyStore}</div>`;
          document.getElementById('i18n-productCount').innerText = dictionary[currentLang].productCount + '0';
          return;
        }

        querySnapshot.forEach((docSnap) => {
          productsList.push({ id: docSnap.id, ...docSnap.data() });
        });

        renderProducts();
      } catch (err) {
        document.getElementById('productGrid').innerHTML = '<div class="col-span-full text-center text-red-500">Error: ' + err.message + '</div>';
      }
    }

    function renderProducts() {
      const grid = document.getElementById('productGrid');
      const t = dictionary[currentLang];
      grid.innerHTML = '';

      document.getElementById('i18n-productCount').innerText = t.productCount + productsList.length;

      productsList.forEach((p) => {
        let prodName = p.name_km;
        if (currentLang === 'en') prodName = p.name_en || p.name_km;
        if (currentLang === 'zh') prodName = p.name_zh || p.name_en || p.name_km;

        grid.innerHTML += `
          <div class="bg-white rounded-xl shadow p-3 flex flex-col justify-between border hover:shadow-lg transition">
            <div>
              <img src="${p.image || 'https://via.placeholder.com/150'}" class="w-full h-36 object-cover rounded-lg mb-2" alt="${prodName}">
              <h3 class="font-bold text-gray-800 line-clamp-1">${prodName}</h3>
              <p class="text-xs text-gray-400 line-clamp-1">${p.name_en || ''}</p>
            </div>
            <div class="mt-3">
              <div class="flex justify-between items-center mb-2">
                <span class="text-emerald-700 font-bold">$${Number(p.price || 0).toFixed(2)}</span>
                <span class="text-xs text-gray-500">${t.stockLabel}${p.stock ?? 0}</span>
              </div>
              <button onclick="addToCart('${p.id}')" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white py-1.5 rounded-lg text-sm font-bold flex items-center justify-center gap-2 transition">
                <i class="fas fa-cart-plus"></i> ${t.addBtn}
              </button>
            </div>
          </div>
        `;
      });
    }

    window.addToCart = function(id) {
      const product = productsList.find(p => p.id === id);
      if (!product) return;

      const existing = cart.find(item => item.id === id);
      if (existing) {
        existing.qty += 1;
      } else {
        cart.push({ ...product, qty: 1 });
      }
      updateCartUI();
    };

    window.updateCartUI = function() {
      const cartItemsContainer = document.getElementById('cartItems');
      const cartCount = document.getElementById('cartCount');
      const cartTotal = document.getElementById('cartTotal');

      cartItemsContainer.innerHTML = '';
      let total = 0;
      let totalQty = 0;

      if (cart.length === 0) {
        cartItemsContainer.innerHTML = `<div class="text-center py-4 text-gray-400 text-sm">${dictionary[currentLang].emptyCart}</div>`;
      } else {
        cart.forEach(item => {
          const itemTotal = item.price * item.qty;
          total += itemTotal;
          totalQty += item.qty;
          
          let prodName = item.name_km;
          if (currentLang === 'en') prodName = item.name_en || item.name_km;
          if (currentLang === 'zh') prodName = item.name_zh || item.name_en || item.name_km;

          cartItemsContainer.innerHTML += `
            <div class="flex justify-between items-center p-2 border-b">
              <div class="flex items-center gap-2">
                <img src="${item.image}" class="w-8 h-8 object-cover rounded" alt="${prodName}">
                <div>
                  <div class="font-bold text-xs line-clamp-1">${prodName}</div>
                  <div class="text-[10px] text-emerald-700">$${Number(item.price).toFixed(2)} x ${item.qty}</div>
                </div>
              </div>
              <div class="flex items-center gap-1">
                <button onclick="changeQty('${item.id}', -1)" class="w-5 h-5 bg-gray-200 hover:bg-gray-300 rounded font-bold text-xs">-</button>
                <span class="text-xs font-bold px-1">${item.qty}</span>
                <button onclick="changeQty('${item.id}', 1)" class="w-5 h-5 bg-gray-200 hover:bg-gray-300 rounded font-bold text-xs">+</button>
              </div>
            </div>
          `;
        });
      }

      cartCount.innerText = totalQty;
      cartTotal.innerText = `$${total.toFixed(2)}`;
    };

    window.changeQty = function(id, delta) {
      const item = cart.find(i => i.id === id);
      if (item) {
        item.qty += delta;
        if (item.qty <= 0) {
          cart = cart.filter(i => i.id !== id);
        }
      }
      updateCartUI();
    };

    window.toggleCartModal = function() {
      document.getElementById('cartModal').classList.toggle('hidden');
    };

    window.checkout = async function() {
      const name = document.getElementById('custName').value.trim();
      const phone = document.getElementById('custPhone').value.trim();
      const address = document.getElementById('custAddress').value.trim();
      const payMethod = document.getElementById('payMethod').value;
      const t = dictionary[currentLang];

      if (cart.length === 0) return alert(t.alertSelectProduct);
      if (!name || !phone || !address) return alert(t.alertFillInfo);

      if (payMethod === 'KHQR' && !selectedSlipBase64) {
        return alert(t.alertUploadSlip);
      }

      const btn = document.getElementById('checkoutBtn');
      const btnText = document.getElementById('i18n-checkoutBtn');
      btnText.innerText = t.sendingBtn;
      btn.disabled = true;

      let totalAmount = 0;
      let orderListText = '';
      
      cart.forEach((item, index) => {
        const itemTotal = item.price * item.qty;
        totalAmount += itemTotal;
        orderListText += `${index + 1}. ${item.name_km} x ${item.qty} = $${itemTotal.toFixed(2)}\n`;
      });

      const payStatusText = payMethod === 'KHQR' ? '💳 វេរប្រាក់តាម KHQR (មាន Slip)' : '💵 បង់ប្រាក់ជាមួយអ្នកដឹក (COD)';

      const message = `🛒 *ការបញ្ជាទិញថ្មី - JINKELAI* 🛒\n` +
                      `-----------------------------\n` +
                      `👤 *ឈ្មោះ:* ${name}\n` +
                      `📞 *ទូរស័ព្ទ:* ${phone}\n` +
                      `📍 *អាសយដ្ឋាន:* ${address}\n` +
                      `💳 *ការបង់ប្រាក់:* ${payStatusText}\n` +
                      `-----------------------------\n` +
                      `📦 *បញ្ជីទំនិញ:*\n${orderListText}` +
                      `-----------------------------\n` +
                      `💰 *សរុប (TOTAL):* $${totalAmount.toFixed(2)}`;

      try {
        const res = await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            chat_id: TELEGRAM_CHAT_ID,
            text: message,
            parse_mode: 'Markdown'
          })
        });

        if (payMethod === 'KHQR' && selectedSlipBase64) {
          const blob = await (await fetch(selectedSlipBase64)).blob();
          const formData = new FormData();
          formData.append('chat_id', TELEGRAM_CHAT_ID);
          formData.append('photo', blob, 'slip.jpg');
          formData.append('caption', `🧾 Slip វេរប្រាក់របស់អតិថិជន៖ ${name} ($${totalAmount.toFixed(2)})`);

          await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto`, {
            method: 'POST',
            body: formData
          });
        }

        if (res.ok) {
          alert(t.orderSuccess);
          cart = [];
          document.getElementById('custName').value = '';
          document.getElementById('custPhone').value = '';
          document.getElementById('custAddress').value = '';
          document.getElementById('paySlipFile').value = '';
          document.getElementById('slipPreview').classList.add('hidden');
          selectedSlipBase64 = '';
          updateCartUI();
          toggleCartModal();
        } else {
          alert(t.orderFailed);
        }
      } catch (err) {
        alert('Error: ' + err.message);
      } finally {
        btnText.innerText = t.checkoutBtn;
        btn.disabled = false;
      }
    };

    // Initialize UI & Language state
    changeLanguage(currentLang);
    loadProducts();
  </script>
</body>
</html>
