<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jinkelai Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;600;700&display=swap');
        body { font-family: 'Kantumruy Pro', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 p-4 md:p-6 pb-20">

    <div class="max-w-5xl mx-auto space-y-6">
        <!-- Header -->
        <header class="bg-slate-800 text-white p-4 rounded-xl flex justify-between items-center shadow-sm">
            <div>
                <h1 class="text-lg font-bold flex items-center gap-2"><i class="fa-solid fa-user-shield text-green-400"></i> Jinkelai Admin</h1>
                <p class="text-xs text-gray-400">ប្រព័ន្ធគ្រប់គ្រងហាងទំនិញ</p>
            </div>
            <span class="text-xs bg-green-500/20 text-green-400 border border-green-500/30 px-2.5 py-1 rounded-full font-semibold">Online</span>
        </header>

        <!-- ១. គ្រប់គ្រង KHQR Payment (បន្ថែម QR Code ថ្មី & ជ្រើសរើសប្រើ) -->
        <div class="bg-white p-5 rounded-xl shadow-sm border space-y-4">
            <h3 class="font-bold text-gray-800 flex items-center gap-2 border-b pb-2">
                <i class="fa-solid fa-qrcode text-red-600"></i> គ្រប់គ្រងរូបភាព KHQR Payment
            </h3>

            <!-- បន្ថែម QR Code ថ្មីចូលប្រព័ន្ធ -->
            <div class="bg-gray-50 p-4 rounded-xl border space-y-3">
                <h4 class="text-xs font-bold text-gray-700"><i class="fa-solid fa-plus-circle text-blue-600 mr-1"></i>បន្ថែម QR Code ធនាគារថ្មី</h4>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <input type="text" id="qrBankName" placeholder="ឈ្មោះធនាគារ (ឧ. ABA, Wing, ACLEDA) *" class="text-xs border rounded-lg p-2.5 outline-none focus:border-red-600">
                    <input type="text" id="qrAccName" placeholder="ឈ្មោះគណនី (ឧ. VUTHY YOL) *" class="text-xs border rounded-lg p-2.5 outline-none focus:border-red-600">
                </div>
                <div>
                    <label class="block text-xs text-gray-500 mb-1">ជ្រើសរើសរូបភាព QR Code *</label>
                    <input type="file" id="qrFileInput" accept="image/*" class="w-full text-xs text-gray-500 border rounded-lg p-1.5 bg-white">
                </div>
                <button onclick="addNewQRCode()" id="btnAddQR" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-2 rounded-lg text-xs transition">
                    + រក្សាទុក QR Code ថ្មីនេះ
                </button>
            </div>

            <!-- បញ្ជី QR Code ដែលមានស្រាប់ក្នុងប្រព័ន្ធ -->
            <div>
                <h4 class="text-xs font-bold text-gray-700 mb-2">បញ្ជី QR Code ទាំងអស់ (ជ្រើសរើសមួយដើម្បីបង្ហាញលើទំព័រអតិថិជន)៖</h4>
                <div id="qrCodeList" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
                    <p class="text-xs text-gray-400 col-span-full text-center py-4">កំពុងផ្ទុក QR Code...</p>
                </div>
            </div>
        </div>

        <!-- ២. បន្ថែមទំនិញថ្មី (Add New Product) -->
        <div class="bg-white p-5 rounded-xl shadow-sm border">
            <h3 class="font-bold text-gray-800 mb-4 flex items-center gap-2 border-b pb-2">
                <i class="fa-solid fa-box-open text-green-600"></i> បន្ថែមទំនិញថ្មីទៅក្នុងហាង
            </h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3 text-xs">
                <input type="text" id="pNameKm" placeholder="ឈ្មោះទំនិញ (ភាសាខ្មែរ) *" class="border rounded-lg p-2.5 outline-none focus:border-green-600">
                <input type="text" id="pNameEn" placeholder="ឈ្មោះទំនិញ (English)" class="border rounded-lg p-2.5 outline-none focus:border-green-600">
                <input type="text" id="pNameZh" placeholder="ឈ្មោះទំនិញ (中文)" class="border rounded-lg p-2.5 outline-none focus:border-green-600">
                <input type="number" step="0.01" id="pPrice" placeholder="តម្លៃ ($) *" class="border rounded-lg p-2.5 outline-none focus:border-green-600">
                <div class="md:col-span-2">
                    <label class="block text-gray-500 mb-1">រូបភាពទំនិញ *</label>
                    <input type="file" id="pImgInput" accept="image/*" class="w-full border rounded-lg p-1.5">
                </div>
            </div>
            <button onclick="addNewProduct()" id="btnAddProduct" class="mt-4 w-full bg-green-700 hover:bg-green-800 text-white font-bold py-2.5 rounded-lg text-xs transition">
                + បន្ថែមទំនិញចូលប្រព័ន្ធ
            </button>
        </div>

        <!-- ៣. បញ្ជីទំនិញទាំងអស់ (Product List) -->
        <div class="bg-white p-5 rounded-xl shadow-sm border">
            <h3 class="font-bold text-gray-800 mb-3 flex items-center gap-2 border-b pb-2">
                <i class="fa-solid fa-list text-blue-600"></i> បញ្ជីទំនិញក្នុងប្រព័ន្ធ
            </h3>
            <div id="adminProductList" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3 max-h-80 overflow-y-auto">
                <p class="text-xs text-gray-400 col-span-full text-center py-4">កំពុងផ្ទុកទំនិញ...</p>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "YOUR_FIREBASE_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // -------------------------------------------------------------
        // ១. មុខងារ QR CODE MANAGEMENT (ថែម QR ថ្មី & ជ្រើសរើសប្រើ)
        // -------------------------------------------------------------

        // បន្ថែម QR Code ថ្មីចូល Firestore Collection "qr_codes"
        async function addNewQRCode() {
            const bankName = document.getElementById('qrBankName').value.trim();
            const accName = document.getElementById('qrAccName').value.trim();
            const file = document.getElementById('qrFileInput').files[0];

            if (!bankName || !accName || !file) {
                return alert("សូមបំពេញឈ្មោះធនាគារ ឈ្មោះគណនី និងជ្រើសរើសរូបភាព QR Code!");
            }

            const btn = document.getElementById('btnAddQR');
            btn.disabled = true; btn.innerText = "កំពុងរក្សាទុក...";

            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    await db.collection("qr_codes").add({
                        bank_name: bankName,
                        acc_name: accName,
                        qr_url: e.target.result,
                        created_at: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    alert("បានរក្សាទុក QR Code ថ្មីជោគជ័យ!");
                    document.getElementById('qrBankName').value = "";
                    document.getElementById('qrAccName').value = "";
                    document.getElementById('qrFileInput').value = "";
                } catch (err) {
                    alert("មានបញ្ហាក្នុងការរក្សាទុក!");
                } finally {
                    btn.disabled = false; btn.innerText = "+ រក្សាទុក QR Code ថ្មីនេះ";
                }
            };
            reader.readAsDataURL(file);
        }

        // បង្ហាញបញ្ជី QR Code ទាំងអស់ និងសម្គាល់ QR ដែលកំពុងដំណើរការ (Active)
        let activeQrUrl = "";
        db.collection("settings").doc("payment").onSnapshot((doc) => {
            if (doc.exists && doc.data().qr_code_url) {
                activeQrUrl = doc.data().qr_code_url;
            }
            renderQRList();
        });

        function renderQRList() {
            db.collection("qr_codes").orderBy("created_at", "desc").onSnapshot((snapshot) => {
                const list = document.getElementById('qrCodeList');
                if (snapshot.empty) {
                    list.innerHTML = `<p class="text-xs text-gray-400 col-span-full text-center py-4">មិនទាន់មាន QR Code នៅឡើយទេ</p>`;
                    return;
                }
                list.innerHTML = snapshot.docs.map(doc => {
                    const data = doc.data();
                    const isActive = data.qr_url === activeQrUrl;
                    return `
                        <div class="border rounded-xl p-3 bg-white flex items-center space-x-3 relative ${isActive ? 'border-2 border-green-500 bg-green-50/30' : 'border-gray-200'}">
                            <img src="${data.qr_url}" class="w-16 h-16 object-contain border rounded-lg bg-gray-50 shrink-0">
                            <div class="flex-grow overflow-hidden">
                                <h5 class="font-bold text-xs text-gray-800 truncate">${data.bank_name}</h5>
                                <p class="text-[11px] text-gray-500 truncate">${data.acc_name}</p>
                                ${isActive 
                                    ? `<span class="inline-block mt-1 text-[10px] bg-green-500 text-white font-bold px-2 py-0.5 rounded">កំពុងប្រើប្រាស់</span>`
                                    : `<button onclick="setActiveQR('${doc.id}', '${data.bank_name}', '${data.acc_name}')" class="mt-1 text-[10px] bg-blue-600 hover:bg-blue-700 text-white px-2 py-0.5 rounded">ប្រើប្រាស់ QR នេះ</button>`
                                }
                            </div>
                            <button onclick="deleteQR('${doc.id}')" class="text-red-400 hover:text-red-600 p-1">
                                <i class="fa-solid fa-trash-can text-xs"></i>
                            </button>
                        </div>
                    `;
                }).join('');
            });
        }

        // កំណត់ជ្រើសរើស QR Code មួយឱ្យដំណើរការលើ Customer App (`index.html`)
        async function setActiveQR(docId, bankName, accName) {
            try {
                const doc = await db.collection("qr_codes").doc(docId).get();
                if (doc.exists) {
                    await db.collection("settings").doc("payment").set({
                        qr_code_url: doc.data().qr_url,
                        bank_name: bankName,
                        acc_name: accName,
                        updated_at: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    alert(`បានផ្លាស់ប្តូរទៅប្រើ QR Code របស់ ${bankName} រួចរាល់!`);
                }
            } catch (err) {
                alert("មានបញ្ហាក្នុងការផ្លាស់ប្តូរ QR Code!");
            }
        }

        // លុប QR Code
        async function deleteQR(id) {
            if (confirm("តើអ្នកពិតជាចង់លុប QR Code នេះមែនទេ?")) {
                await db.collection("qr_codes").doc(id).delete();
            }
        }

        // -------------------------------------------------------------
        // ២. មុខងារ PRODUCT MANAGEMENT (ថែម & លុបទំនិញ)
        // -------------------------------------------------------------
        async function addNewProduct() {
            const nameKm = document.getElementById('pNameKm').value.trim();
            const nameEn = document.getElementById('pNameEn').value.trim();
            const nameZh = document.getElementById('pNameZh').value.trim();
            const price = parseFloat(document.getElementById('pPrice').value);
            const imgFile = document.getElementById('pImgInput').files[0];

            if (!nameKm || isNaN(price) || !imgFile) return alert("សូមបំពេញឈ្មោះ តម្លៃ និងជ្រើសរើសរូបភាពទំនិញ!");

            const btn = document.getElementById('btnAddProduct');
            btn.disabled = true; btn.innerText = "កំពុងរក្សាទុកទំនិញ...";

            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    await db.collection("products").add({
                        name_km: nameKm,
                        name_en: nameEn || nameKm,
                        name_zh: nameZh || nameKm,
                        price: price,
                        img: e.target.result,
                        created_at: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    alert("បានបន្ថែមទំនិញថ្មីជោគជ័យ!");
                    document.getElementById('pNameKm').value = "";
                    document.getElementById('pNameEn').value = "";
                    document.getElementById('pNameZh').value = "";
                    document.getElementById('pPrice').value = "";
                    document.getElementById('pImgInput').value = "";
                } catch (err) { alert("មានបញ្ហាក្នុងការបន្ថែមទំនិញ!"); }
                finally { btn.disabled = false; btn.innerText = "+ បន្ថែមទំនិញចូលប្រព័ន្ធ"; }
            };
            reader.readAsDataURL(imgFile);
        }

        db.collection("products").orderBy("created_at", "desc").onSnapshot((snapshot) => {
            const list = document.getElementById('adminProductList');
            if (snapshot.empty) {
                list.innerHTML = `<p class="text-xs text-gray-400 col-span-full text-center py-4">មិនទាន់មានទំនិញនៅឡើយទេ</p>`;
                return;
            }
            list.innerHTML = snapshot.docs.map(doc => {
                const data = doc.data();
                return `
                    <div class="border rounded-lg p-2.5 flex items-center justify-between bg-gray-50">
                        <div class="flex items-center space-x-2 overflow-hidden">
                            <img src="${data.img}" class="w-10 h-10 object-cover rounded border shrink-0">
                            <div class="truncate">
                                <h4 class="font-semibold text-xs truncate">${data.name_km}</h4>
                                <span class="text-green-700 font-bold text-xs">$${data.price.toFixed(2)}</span>
                            </div>
                        </div>
                        <button onclick="deleteProduct('${doc.id}')" class="text-red-500 hover:text-red-700 p-1 shrink-0">
                            <i class="fa-solid fa-trash-can text-sm"></i>
                        </button>
                    </div>
                `;
            }).join('');
        });

        async function deleteProduct(id) {
            if (confirm("តើអ្នកពិតជាចង់លុបទំនិញនេះមែនទេ?")) {
                await db.collection("products").doc(id).delete();
            }
        }
    </script>
</body>
</html>
