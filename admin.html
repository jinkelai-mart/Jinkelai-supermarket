<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin - Jinkelai</title>
  <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen font-['Kantumruy_Pro'] flex flex-col">

  <!-- Login Section -->
  <div id="loginSection" class="fixed inset-0 bg-emerald-900/90 z-50 flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-sm p-6 rounded-2xl shadow-2xl space-y-4">
      <div class="text-center">
        <span class="text-4xl">🛍️🛒</span>
        <h2 class="text-lg font-bold text-gray-800 mt-2">Jinkelai Admin</h2>
        <p class="text-[11px] text-gray-500 mt-1">Firebase Authentication</p>
      </div>
      <div class="space-y-3 text-xs">
        <div>
          <label class="block font-semibold mb-1">Email</label>
          <input type="email" id="loginEmail" value="nhoemvuthy25@gmail.com" class="w-full p-2.5 border rounded-xl">
        </div>
        <div>
          <label class="block font-semibold mb-1">Password</label>
          <input type="password" id="loginPass" class="w-full p-2.5 border rounded-xl">
        </div>
        <button onclick="doLogin()" id="loginBtn" class="w-full py-2.5 bg-emerald-700 hover:bg-emerald-800 text-white font-bold rounded-xl">ចូលប្រព័ន្ធ / Login</button>
        <p id="loginError" class="text-center text-red-500 text-[11px] hidden"></p>
      </div>
    </div>
  </div>

  <!-- Admin Dashboard -->
  <div id="adminDashboard" class="hidden flex-1 flex flex-col">
    <header class="bg-emerald-800 text-white p-4 shadow-md flex justify-between items-center sticky top-0 z-30">
      <h1 class="font-bold text-base">⚙️ Admin Dashboard</h1>
      <button onclick="doLogout()" class="bg-red-500 hover:bg-red-600 px-3 py-1 text-xs rounded-lg font-bold">ចាកចេញ</button>
    </header>

    <main class="max-w-4xl w-full mx-auto p-4 space-y-5 flex-1">

      <!-- Category Management Box -->
      <div class="bg-white p-4 rounded-2xl border shadow-sm space-y-3">
        <h3 class="font-bold text-xs text-gray-700">🏷️ បន្ថែម និងគ្រប់គ្រងប្រភេទទំនិញ (Categories)</h3>
        <div class="flex gap-2 text-xs">
          <input type="text" id="catNameInput" placeholder="ឧ. គ្រឿងទេស, សម្ភារៈផ្ទះបាយ, ភេសជ្ជៈ..." class="flex-1 p-2 border rounded-xl">
          <button onclick="addCategory()" class="bg-emerald-700 text-white font-bold px-4 py-2 rounded-xl">បន្ថែម</button>
        </div>
        <div id="categoryList" class="flex flex-wrap gap-2 pt-1 text-xs"></div>
      </div>

      <!-- Add/Edit Product Box -->
      <div class="bg-white p-4 rounded-2xl border shadow-sm space-y-3">
        <h3 class="font-bold text-xs text-gray-700" id="formTitle">➕ បន្ថែមទំនិញថ្មី</h3>
        <div class="space-y-2 text-xs">
          
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
            <div>
              <label class="font-semibold text-gray-600">ជ្រើសរើសប្រភេទទំនិញ *</label>
              <select id="pCategory" class="w-full p-2 border rounded-xl mt-1">
                <option value="">-- ជ្រើសរើសប្រភេទ --</option>
              </select>
            </div>
            <div>
              <label class="font-semibold text-gray-600">ប្រភេទការលក់ *</label>
              <select id="pSaleType" class="w-full p-2 border rounded-xl mt-1">
                <option value="retail">ទំនិញលក់រាយ (Retail)</option>
                <option value="wholesale">ទំនិញលក់ដុំ (Wholesale)</option>
              </select>
            </div>
          </div>

          <div>
            <label class="font-semibold text-gray-600">ឈ្មោះភាសាខ្មែរ (Khmer) *</label>
            <input type="text" id="pNameKm" placeholder="ឧទាហរណ៍៖ ស្ពៃបៃតង" class="w-full p-2 border rounded-xl mt-1">
          </div>
          <div>
            <label class="font-semibold text-gray-600">Name in English</label>
            <input type="text" id="pNameEn" class="w-full p-2 border rounded-xl mt-1">
          </div>
          <div>
            <label class="font-semibold text-gray-600">中文名称 (Chinese)</label>
            <input type="text" id="pNameZh" class="w-full p-2 border rounded-xl mt-1">
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="font-semibold text-gray-600">តម្លៃ ($) *</label>
              <input type="number" id="pPrice" step="0.01" class="w-full p-2 border rounded-xl mt-1">
            </div>
            <div>
              <label class="font-semibold text-gray-600">បញ្ចុះតម្លៃ (%)</label>
              <input type="number" id="pDiscount" class="w-full p-2 border rounded-xl mt-1">
            </div>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="font-semibold text-gray-600">ស្តុក *</label>
              <input type="number" id="pStock" class="w-full p-2 border rounded-xl mt-1">
            </div>
            <div>
              <label class="font-semibold text-gray-600">Barcode</label>
              <div class="flex gap-1 mt-1">
                <input type="text" id="pBarcode" class="flex-1 p-2 border rounded-xl">
                <button type="button" onclick="startBarcodeScan()" class="bg-blue-600 text-white px-3 rounded-xl text-xs font-bold whitespace-nowrap">📷 ស្កែន</button>
              </div>
            </div>
          </div>

          <div>
            <label class="font-semibold text-gray-600">រូបភាពទំនិញ</label>
            <input type="file" id="pImageFile" accept="image/*" class="w-full p-2 border rounded-xl mt-1 text-xs">
            <div id="imagePreview" class="mt-2 hidden">
              <img id="previewImg" class="w-24 h-24 object-cover rounded-lg border">
            </div>
          </div>

          <input type="hidden" id="editId" value="">
          <div class="flex gap-2">
            <button onclick="saveProduct()" class="flex-1 bg-emerald-700 text-white font-bold py-2.5 rounded-xl" id="saveBtn">រក្សាទុកទំនិញ</button>
            <button onclick="cancelEdit()" id="cancelBtn" class="hidden bg-gray-300 text-gray-700 font-bold py-2.5 px-4 rounded-xl">បោះបង់</button>
          </div>
        </div>
      </div>

      <!-- Product List -->
      <div class="bg-white p-4 rounded-2xl border shadow-sm space-y-3">
        <h3 class="font-bold text-xs text-gray-700">📦 បញ្ជីទំនិញ (Firebase)</h3>
        <div id="adminProductList" class="space-y-2 text-xs"></div>
      </div>

    </main>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
    import { getFirestore, collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: "AIzaSyBMeERdMiNIhctpNGReM8nHIVHfweQfaDE",
      authDomain: "jinkelai-supermarket-e4786.firebaseapp.com",
      projectId: "jinkelai-supermarket-e4786",
      storageBucket: "jinkelai-supermarket-e4786.firebasestorage.app",
      messagingSenderId: "345735387486",
      appId: "1:345735387486:web:44fc724756c3b77a7617cf",
      measurementId: "G-P0G4RNKKMG"
    };

    const IMGBB_API_KEY = '5ae4d8edc2285133fecc302b45b1b795';

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let products = [];
    let categories = [];
    let selectedFile = null;

    async function uploadToImgBB(file) {
      const formData = new FormData();
      formData.append('image', file);
      const res = await fetch('https://api.imgbb.com/1/upload?key=' + IMGBB_API_KEY, { method: 'POST', body: formData });
      const data = await res.json();
      if (data.success && data.data && data.data.url) return data.data.url;
      throw new Error('ImgBB upload failed');
    }

    document.getElementById('pImageFile')?.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        selectedFile = file;
        const reader = new FileReader();
        reader.onload = (ev) => {
          document.getElementById('previewImg').src = ev.target.result;
          document.getElementById('imagePreview').classList.remove('hidden');
        };
        reader.readAsDataURL(file);
      }
    });

    // Realtime listeners
    onSnapshot(collection(db, 'categories'), (snapshot) => {
      categories = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
      renderCategoryUI();
    });

    onSnapshot(collection(db, 'products'), (snapshot) => {
      products = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
      renderAdminList();
    });

    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.getElementById('loginSection').classList.add('hidden');
        document.getElementById('adminDashboard').classList.remove('hidden');
      } else {
        document.getElementById('loginSection').classList.remove('hidden');
        document.getElementById('adminDashboard').classList.add('hidden');
      }
    });

    window.doLogin = async function() {
      const e = document.getElementById('loginEmail').value.trim();
      const p = document.getElementById('loginPass').value.trim();
      try { await signInWithEmailAndPassword(auth, e, p); } catch (err) { alert('Login មិនត្រឹមត្រូវ!'); }
    };

    window.doLogout = async function() { await signOut(auth); };

    // Add Category
    window.addCategory = async function() {
      const name = document.getElementById('catNameInput').value.trim();
      if (!name) return alert('សូមបញ្ចូលឈ្មោះ Category!');
      await addDoc(collection(db, 'categories'), { name, createdAt: serverTimestamp() });
      document.getElementById('catNameInput').value = '';
    };

    window.deleteCategory = async function(id) {
      if (confirm('តើចង់លុប Category នេះមែនទេ?')) {
        await deleteDoc(doc(db, 'categories', id));
      }
    };

    function renderCategoryUI() {
      const list = document.getElementById('categoryList');
      const select = document.getElementById('pCategory');
      list.innerHTML = '';
      select.innerHTML = '<option value="">-- ជ្រើសរើសប្រភេទ --</option>';

      categories.forEach(c => {
        list.innerHTML += `
          <span class="inline-flex items-center gap-1.5 px-2.5 py-1 bg-emerald-50 text-emerald-800 rounded-lg border border-emerald-200 font-semibold">
            ${c.name}
            <button onclick="deleteCategory('${c.id}')" class="text-red-500 font-bold ml-1 hover:text-red-700">✕</button>
          </span>`;
        select.innerHTML += `<option value="${c.id}">${c.name}</option>`;
      });
    }

    function renderAdminList() {
      const container = document.getElementById('adminProductList');
      container.innerHTML = products.length ? '' : '<p class="text-center text-gray-400 py-4">គ្មានទំនិញ</p>';
      products.forEach((p) => {
        const cat = categories.find(c => c.id === p.categoryId);
        const catName = cat ? cat.name : 'គ្មាន';
        const saleTypeName = p.saleType === 'wholesale' ? 'លក់ដុំ' : 'លក់រាយ';
        
        container.innerHTML += `
          <div class="flex flex-col sm:flex-row items-start justify-between p-3 border rounded-xl gap-2 bg-white">
            <div class="flex items-start gap-3 w-full">
              <img src="${p.image || 'https://via.placeholder.com/150'}" class="w-14 h-14 object-cover rounded-lg border flex-shrink-0">
              <div class="flex-1 min-w-0">
                <h4 class="font-bold text-gray-800 text-sm">${p.name_km || p.name || '—'}</h4>
                <p class="text-[10px] text-emerald-700 font-semibold mt-0.5">ប្រភេទ: ${catName} | ${saleTypeName}</p>
                <div class="text-[11px] text-gray-500 mt-1">
                  $${p.price} | ស្តុក: <b>${p.stock}</b>
                </div>
              </div>
            </div>
            <div class="flex items-center gap-1.5">
              <button onclick="window.editProduct('${p.id}')" class="px-2 py-1 bg-blue-100 text-blue-700 rounded text-[10px] font-bold">✏️ កែ</button>
              <button onclick="window.deleteProduct('${p.id}')" class="px-2 py-1 bg-red-100 text-red-600 rounded text-[10px] font-bold">🗑️</button>
            </div>
          </div>`;
      });
    }

    window.saveProduct = async function() {
      const categoryId = document.getElementById('pCategory').value;
      const saleType = document.getElementById('pSaleType').value;
      const name_km = document.getElementById('pNameKm').value.trim();
      const price = parseFloat(document.getElementById('pPrice').value);
      const stock = parseInt(document.getElementById('pStock').value) || 0;
      const editId = document.getElementById('editId').value;

      if (!categoryId) return alert("សូមជ្រើសរើសប្រភេទទំនិញ (Category)!");
      if (!name_km) return alert("សូមបំពេញឈ្មោះទំនិញ!");

      let imageUrl = '';
      if (selectedFile) imageUrl = await uploadToImgBB(selectedFile);

      const data = {
        categoryId, saleType, name_km,
        name_en: document.getElementById('pNameEn').value.trim(),
        name_zh: document.getElementById('pNameZh').value.trim(),
        price, stock,
        discount: parseFloat(document.getElementById('pDiscount').value) || 0,
        barcode: document.getElementById('pBarcode').value.trim(),
        active: true
      };

      if (editId) {
        if (imageUrl) data.image = imageUrl;
        await updateDoc(doc(db, 'products', editId), data);
      } else {
        data.image = imageUrl || 'https://via.placeholder.com/300';
        data.createdAt = serverTimestamp();
        await addDoc(collection(db, 'products'), data);
      }
      cancelEdit();
    };

    window.editProduct = function(id) {
      const p = products.find(x => x.id === id);
      if (!p) return;
      document.getElementById('editId').value = id;
      document.getElementById('pCategory').value = p.categoryId || '';
      document.getElementById('pSaleType').value = p.saleType || 'retail';
      document.getElementById('pNameKm').value = p.name_km || '';
      document.getElementById('pNameEn').value = p.name_en || '';
      document.getElementById('pNameZh').value = p.name_zh || '';
      document.getElementById('pPrice').value = p.price || '';
      document.getElementById('pDiscount').value = p.discount || 0;
      document.getElementById('pStock').value = p.stock || 0;
      document.getElementById('pBarcode').value = p.barcode || '';
      document.getElementById('formTitle').innerText = '✏️ កែប្រែទំនិញ';
      document.getElementById('cancelBtn').classList.remove('hidden');
    };

    window.cancelEdit = function() {
      document.getElementById('editId').value = '';
      document.getElementById('pNameKm').value = '';
      document.getElementById('pPrice').value = '';
      document.getElementById('cancelBtn').classList.add('hidden');
    };

    window.deleteProduct = async function(id) {
      if (confirm("តើប្រាកដជាចង់លុបទំនិញនេះ?")) {
        await deleteDoc(doc(db, 'products', id));
      }
    };
  </script>
</body>
</html>
