<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin store-Jinkelai Supermarket</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4 min-h-screen">

  <div class="max-w-xl mx-auto bg-white p-6 rounded-xl shadow-md">
    <h2 class="text-2xl font-bold mb-4 text-emerald-800 text-center">⚙️ Admin Dashboard</h2>

    <form id="productForm" onsubmit="saveProduct(event)" class="space-y-4">
      <input type="hidden" id="editId">

      <div>
        <label class="block text-sm font-medium mb-1">ឈ្មោះភាសាខ្មែរ (Khmer) *</label>
        <input type="text" id="pNameKm" required class="w-full border p-2 rounded focus:ring-2 focus:ring-emerald-500">
      </div>

      <div>
        <label class="block text-sm font-medium mb-1">Name in English</label>
        <input type="text" id="pNameEn" class="w-full border p-2 rounded focus:ring-2 focus:ring-emerald-500">
      </div>

      <div>
        <label class="block text-sm font-medium mb-1">中文名称 (Chinese)</label>
        <input type="text" id="pNameZh" class="w-full border p-2 rounded focus:ring-2 focus:ring-emerald-500">
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium mb-1">តម្លៃ ($) *</label>
          <input type="number" step="0.01" id="pPrice" required class="w-full border p-2 rounded focus:ring-2 focus:ring-emerald-500">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">បញ្ចុះតម្លៃ (%)</label>
          <input type="number" id="pDiscount" value="0" class="w-full border p-2 rounded focus:ring-2 focus:ring-emerald-500">
        </div>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium mb-1">ស្តុក *</label>
          <input type="number" id="pStock" required class="w-full border p-2 rounded focus:ring-2 focus:ring-emerald-500">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Barcode</label>
          <input type="text" id="pBarcode" class="w-full border p-2 rounded focus:ring-2 focus:ring-emerald-500">
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium mb-1">រូបភាពទំនិញ (Upload Image)</label>
        <input type="file" id="pImageFile" accept="image/*" onchange="previewImage(event)" class="w-full border p-2 rounded">
        <img id="imagePreview" class="mt-2 h-28 object-cover rounded hidden">
      </div>

      <button type="submit" id="saveBtn" class="w-full bg-emerald-700 text-white py-2 rounded font-bold hover:bg-emerald-800 transition">
        រក្សាទុកទំនិញ
      </button>
    </form>

    <hr class="my-6">

    <h3 class="text-lg font-bold mb-3">📦 បញ្ជីទំនិញ</h3>
    <div id="productList" class="space-y-3"></div>
  </div>

  <!-- Firebase Setup -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBMeERdMiNIhctpNGReM8nHIVHfweQfaDE",
      authDomain: "jinkelai-supermarket-e4786.firebaseapp.com",
      projectId: "jinkelai-supermarket-e4786",
      storageBucket: "jinkelai-supermarket-e4786.firebasestorage.app",
      messagingSenderId: "345735387486",
      appId: "1:345735387486:web:44fc724756c3b77a7617cf",
      measurementId: "G-P0G4RNKKMG"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let selectedBase64 = '';

    window.previewImage = function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          selectedBase64 = evt.target.result;
          const img = document.getElementById('imagePreview');
          img.src = selectedBase64;
          img.classList.remove('hidden');
        };
        reader.readAsDataURL(file);
      }
    };

    window.saveProduct = async function(e) {
      e.preventDefault();
      const btn = document.getElementById('saveBtn');
      btn.innerText = 'កំពុងរក្សាទុក...';
      btn.disabled = true;

      const editId = document.getElementById('editId').value;
      const data = {
        name_km: document.getElementById('pNameKm').value,
        name_en: document.getElementById('pNameEn').value,
        name_zh: document.getElementById('pNameZh').value,
        price: parseFloat(document.getElementById('pPrice').value),
        discount: parseFloat(document.getElementById('pDiscount').value) || 0,
        stock: parseInt(document.getElementById('pStock').value),
        barcode: document.getElementById('pBarcode').value,
        active: true
      };

      try {
        if (selectedBase64) {
          data.image = selectedBase64;
        }

        if (editId) {
          await updateDoc(doc(db, 'products', editId), data);
          alert('🎉 កែប្រែទំនិញជោគជ័យ!');
        } else {
          data.image = selectedBase64 || 'https://via.placeholder.com/150';
          data.createdAt = serverTimestamp();
          await addDoc(collection(db, 'products'), data);
          alert('🎉 បន្ថែមទំនិញជោគជ័យ!');
        }

        document.getElementById('productForm').reset();
        document.getElementById('editId').value = '';
        document.getElementById('imagePreview').classList.add('hidden');
        selectedBase64 = '';
        loadProducts();
      } catch (err) {
        alert('មានបញ្ហា៖ ' + err.message);
      } finally {
        btn.innerText = 'រក្សាទុកទំនិញ';
        btn.disabled = false;
      }
    };

    window.loadProducts = async function() {
      const container = document.getElementById('productList');
      container.innerHTML = 'កំពុងទាញទិន្នន័យ...';
      try {
        const querySnapshot = await getDocs(collection(db, 'products'));
        container.innerHTML = '';
        querySnapshot.forEach((docSnap) => {
          const item = docSnap.data();
          container.innerHTML += `
            <div class="flex items-center justify-between p-3 border rounded">
              <div class="flex items-center gap-3">
                <img src="${item.image}" class="w-12 h-12 object-cover rounded">
                <div>
                  <div class="font-bold">${item.name_km}</div>
                  <div class="text-sm text-gray-500">$${item.price} | ស្តុក: ${item.stock}</div>
                </div>
              </div>
              <button onclick="deleteProduct('${docSnap.id}')" class="text-red-600 hover:underline text-sm font-bold">លុប</button>
            </div>
          `;
        });
      } catch (err) {
        container.innerHTML = 'មិនអាចទាញទិន្នន័យបាន៖ ' + err.message;
      }
    };

    window.deleteProduct = async function(id) {
      if (confirm('តើអ្នកប្រាកដថាចង់លុបទំនិញនេះ?')) {
        await deleteDoc(doc(db, 'products', id));
        loadProducts();
      }
    };

    // Load ទំនិញពេលបើក Admin Page
    loadProducts();
  </script>
</body>
</html>
