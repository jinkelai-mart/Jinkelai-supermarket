  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, updatePassword } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
    import { getFirestore, collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc, query, orderBy, serverTimestamp, setDoc, getDoc } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
    import { getAnalytics } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-analytics.js';

    const firebaseConfig = {
      apiKey: "AIzaSyBMeERdMiNIhctpNGReM8nHIVHfweQfaDE",
      authDomain: "jinkelai-supermarket-e4786.firebaseapp.com",
      projectId: "jinkelai-supermarket-e4786",
      storageBucket: "jinkelai-supermarket-e4786.firebasestorage.app",
      messagingSenderId: "345735387486",
      appId: "1:345735387486:web:44fc724756c3b77a7617cf",
      measurementId: "G-P0G4RNKKMG"
    };
    const IMGBB_API_KEY = '5ae4d8edc2285133fecc302b45b1b795';

    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let products = [];
    let orders = [];
    let selectedFile = null;
    let selectedKhqrFile = null;
    let orderFilter = 'pending';
    let lastOrderCount = 0;
    let knownOrderIds = new Set();
    let html5QrCode = null;

    // ========== UPLOAD ==========
    async function uploadToImgBB(file) {
      const formData = new FormData();
      formData.append('image', file);
      const res = await fetch('https://api.imgbb.com/1/upload?key=' + IMGBB_API_KEY, { method: 'POST', body: formData });
      const data = await res.json();
      if (data.success && data.data && data.data.url) return data.data.url;
      throw new Error((data.error && data.error.message) || 'ImgBB upload failed');
    }

    // ========== NOTIFICATIONS ==========
    function playNotifySound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.frequency.value = 880; gain.gain.value = 0.35;
        osc.start();
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
        osc.stop(ctx.currentTime + 0.4);
        setTimeout(() => {
          const osc2 = ctx.createOscillator();
          const gain2 = ctx.createGain();
          osc2.connect(gain2); gain2.connect(ctx.destination);
          osc2.frequency.value = 1175; gain2.gain.value = 0.35;
          osc2.start();
          gain2.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
          osc2.stop(ctx.currentTime + 0.4);
        }, 250);
      } catch (e) {}
    }

    function speakNewOrder(order) {
      try {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        const name = order.customer?.name || 'អតិថិជន';
        const total = Number(order.total || 0).toFixed(2);
        const pay = order.paymentMethod === 'khqr' ? 'ខេអេចគ្យូអា' : 'ស៊ីអូឌី';
        const text = `មានការបញ្ជាទិញថ្មី! ពី ${name} ចំនួន ${total} ដុល្លារ បង់តាម ${pay}`;
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'km-KH'; u.rate = 0.9;
        const voices = window.speechSynthesis.getVoices();
        const kmVoice = voices.find(v => v.lang.startsWith('km'));
        if (kmVoice) u.voice = kmVoice;
        else { u.lang = 'en-US'; u.text = `New order from ${name}, total ${total} dollars`; }
        window.speechSynthesis.speak(u);
      } catch (e) {}
    }

    function showBrowserNotify(order) {
      try {
        if (!('Notification' in window)) return;
        const title = '🛍️ ការបញ្ជាទិញថ្មី!';
        const body = `${order.customer?.name || '—'} · $${Number(order.total || 0).toFixed(2)} · ${order.paymentMethod === 'khqr' ? 'KHQR' : 'COD'}`;
        if (Notification.permission === 'granted') {
          new Notification(title, { body, icon: 'logo.png', tag: 'new-order' });
        } else if (Notification.permission !== 'denied') {
          Notification.requestPermission().then(p => {
            if (p === 'granted') new Notification(title, { body, icon: 'logo.png', tag: 'new-order' });
          });
        }
      } catch (e) {}
    }

    function showOrderToast(order) {
      let toast = document.getElementById('orderToast');
      if (!toast) {
        toast = document.createElement('div');
        toast.id = 'orderToast';
        toast.className = 'fixed top-16 left-1/2 -translate-x-1/2 z-[300] bg-emerald-700 text-white px-4 py-3 rounded-2xl shadow-2xl text-sm font-bold max-w-sm w-[90%] text-center transition-all duration-300 opacity-0 pointer-events-none';
        document.body.appendChild(toast);
      }
      toast.innerHTML = `🛍️ ការបញ្ជាទិញថ្មី!<br><span class="font-normal text-xs">${order.customer?.name || '—'} · $${Number(order.total || 0).toFixed(2)}</span>`;
      toast.classList.remove('opacity-0', 'pointer-events-none');
      setTimeout(() => toast.classList.add('opacity-0', 'pointer-events-none'), 6000);
    }

    function notifyNewOrders(brandNew) {
      brandNew.forEach((o, i) => {
        setTimeout(() => {
          playNotifySound();
          speakNewOrder(o);
          showBrowserNotify(o);
          showOrderToast(o);
        }, i * 1500);
      });
      const orig = document.title;
      document.title = '🔔 Order ថ្មី! — Admin';
      setTimeout(() => { document.title = orig; }, 5000);
      setTimeout(() => switchTab('orders'), 500);
    }

    // ========== TABS ==========
    window.switchTab = function(tab) {
      ['orders', 'products', 'add', 'settings'].forEach(t => {
        const sec = document.getElementById('section-' + t);
        const btn = document.getElementById('tab-' + t);
        if (sec) sec.classList.toggle('hidden-section', t !== tab);
        if (btn) btn.classList.toggle('active', t === tab);
      });
      window.scrollTo(0, 0);
    };

    window.scrollToOrders = function() { switchTab('orders'); };

    // ========== AUTH ==========
    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.getElementById('loginSection').classList.add('hidden');
        document.getElementById('adminDashboard').classList.remove('hidden');
        if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission();
        if (window.speechSynthesis) window.speechSynthesis.getVoices();
      } else {

    window.doLogin = async function() {
      const e = document.getElementById('loginEmail').value.trim();
      const p = document.getElementById('loginPass').value.trim();
      const errEl = document.getElementById('loginError');
      const btn = document.getElementById('loginBtn');
      if (!e || !p) { errEl.innerText = 'សូមបញ្ចូល Email និង Password!'; errEl.classList.remove('hidden'); return; }
      btn.disabled = true; btn.innerText = 'កំពុងចូល...'; errEl.classList.add('hidden');
      try {
        await signInWithEmailAndPassword(auth, e, p);
      } catch (err) {
        let msg = 'Email ឬ Password មិនត្រឹមត្រូវ!';
        if (err.code === 'auth/user-not-found') msg = 'មិនមាន User នេះ!';
        if (err.code === 'auth/wrong-password') msg = 'Password មិនត្រឹមត្រូវ!';
        if (err.code === 'auth/invalid-credential') msg = 'Email ឬ Password មិនត្រឹមត្រូវ!';
        if (err.code === 'auth/too-many-requests') msg = 'ព្យាយាមច្រើនពេក សូមរង់ចាំ!';
        errEl.innerText = msg; errEl.classList.remove('hidden');
      } finally {
        btn.disabled = false; btn.innerText = 'ចូលប្រព័ន្ធ / Login';
      }
    };

    window.setOrderFilter = function(f) {
      orderFilter = f;
      ['pending', 'confirmed', 'all'].forEach(x => {
        const btn = document.getElementById('f-' + x);
        if (btn) {
          btn.className = 'order-filter px-3 py-1.5 rounded-full text-[11px] font-bold ' +
            (x === f ? 'bg-emerald-700 text-white' : 'bg-gray-200 text-gray-600');
          if (x === 'pending' && f === 'pending') btn.className = 'order-filter px-3 py-1.5 rounded-full text-[11px] font-bold bg-amber-500 text-white';
        }
      });
      renderOrders();
    };

    function isPending(o) {
      return o.status === 'pending_payment' || o.status === 'new' || !o.status;
    }

    function getStatusLabel(status) {
      const map = {
        'confirmed': { text: '✅ បានបញ្ជាក់', cls: 'bg-emerald-100 text-emerald-800' },
        'pending_payment': { text: '⏳ រង់ចាំការទូទាត់', cls: 'bg-amber-100 text-amber-800' },
        'paid': { text: '✅ បានបង់ប្រាក់', cls: 'bg-emerald-100 text-emerald-800' },
        'processing': { text: '🚚 កំពុងដឹក', cls: 'bg-blue-100 text-blue-800' },
        'delivered': { text: '📦 ដឹករួច', cls: 'bg-gray-200 text-gray-700' },
        'cancelled': { text: '❌ បោះបង់', cls: 'bg-red-100 text-red-700' },
        'new': { text: '⏳ រង់ចាំ', cls: 'bg-amber-100 text-amber-800' }
      };
      return map[status] || { text: '⏳ រង់ចាំ', cls: 'bg-amber-100 text-amber-800' };
    }

    function updatePendingBadge() {
      const pending = orders.filter(isPending).length;
      const badge = document.getElementById('pendingBadge');
      if (!badge) return;
      if (pending > 0) {
        badge.innerText = pending > 99 ? '99+' : pending;
        badge.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
      }
    }

    function renderOrders() {
      const container = document.getElementById('ordersList');
      const info = document.getElementById('orderFilterInfo');
      let list = orders;

      if (orderFilter === 'pending') {
        list = orders.filter(isPending);
        info.innerText = list.length ? `មាន ${list.length} ការបញ្ជាទិញរង់ចាំបញ្ជាក់` : '✅ គ្មានការបញ្ជាទិញរង់ចាំ';
      } else if (orderFilter === 'confirmed') {
        list = orders.filter(o => ['confirmed','paid','processing','delivered'].includes(o.status));
        info.innerText = `បង្ហាញ ${list.length} ការបញ្ជាទិញដែលបានបញ្ជាក់`;
      } else {
        list = orders;
        info.innerText = `ទាំងអស់ ${list.length} ការបញ្ជាទិញ`;
      }

      if (!list.length) {
        container.innerHTML = '<p class="text-center text-gray-400 py-8">មិនមានការបញ្ជាទិញក្នុងតម្រងនេះ</p>';
        return;
      }

      container.innerHTML = '';
      list.slice(0, 50).forEach(o => {
        const itemsText = (o.items || []).map(i => i.name + ' x' + i.qty).join(', ');
        const dateStr = o.createdAt?.toDate ? o.createdAt.toDate().toLocaleString('km-KH') : '—';
        const payMethod = o.paymentMethod === 'khqr' ? '📱 KHQR' : (o.paymentMethod === 'cod' ? '💵 COD' : '—');
        const st = getStatusLabel(o.status);
        const pending = isPending(o);
        const borderCls = pending ? 'border-amber-400 border-2 bg-amber-50' : 'border bg-gray-50';

        container.innerHTML += `
          <div class="p-3.5 rounded-xl ${borderCls}">
            <div class="flex justify-between items-start gap-2">
              <div class="flex-1 min-w-0">
                <p class="font-bold text-gray-800 text-sm">${o.customer?.name || '—'} · <a href="tel:${o.customer?.phone || ''}" class="text-blue-600">${o.customer?.phone || ''}</a></p>
                <p class="text-[11px] text-gray-500 mt-0.5">${o.customer?.address || ''}</p>
                <p class="text-[11px] mt-1.5 font-medium text-gray-700">${itemsText}</p>
                <p class="text-[10px] text-gray-400 mt-1">${dateStr} · ${payMethod}</p>
                ${o.locationImage ? '<a href="' + o.locationImage + '" target="_blank" class="text-[10px] text-blue-600 underline block mt-0.5">📷 រូបទីតាំង</a>' : ''}
                ${o.location && o.location.lat ? '<a href="https://maps.google.com/?q=' + o.location.lat + ',' + o.location.lng + '" target="_blank" class="text-[10px] text-blue-600 underline block">🗺 បើក Map</a>' : ''}
              </div>
              <div class="text-right space-y-1.5 shrink-0">
                <p class="font-bold text-emerald-700 text-sm">$${Number(o.total || 0).toFixed(2)}</p>
                <span class="status-badge ${st.cls}">${st.text}</span>
                <div class="flex flex-col gap-1 mt-1.5">
                  ${pending ? `<button onclick="window.updateOrderStatus('${o.id}','confirmed')" class="text-[11px] px-2.5 py-1.5 bg-emerald-600 text-white rounded-lg font-bold shadow">✅ បញ្ជាក់បង់ប្រាក់</button>` : ''}
                  <button onclick="window.updateOrderStatus('${o.id}','processing')" class="text-[10px] px-2 py-1 bg-blue-100 text-blue-800 rounded-lg font-bold">🚚 កំពុងដឹក</button>
                  <button onclick="window.updateOrderStatus('${o.id}','delivered')" class="text-[10px] px-2 py-1 bg-gray-200 text-gray-700 rounded-lg font-bold">📦 ដឹករួច</button>

                </div>
              </div>
            </div>
          </div>`;
      });
    }

    window.saveProduct = async function() {
      if (!auth.currentUser) return alert('សូម Login មុន!');
      const name_km = document.getElementById('pNameKm').value.trim();
      const name_en = document.getElementById('pNameEn').value.trim();
      const name_zh = document.getElementById('pNameZh').value.trim();
      const price = parseFloat(document.getElementById('pPrice').value);
      const discount = parseFloat(document.getElementById('pDiscount').value) || 0;
      let stock = Math.floor(parseFloat(document.getElementById('pStock').value));
      if (isNaN(stock) || stock < 0) stock = 0;
      const barcode = document.getElementById('pBarcode').value.trim();
      const editId = document.getElementById('editId').value;
      let category = document.getElementById('pCategoryCustom').value.trim();
      if (!category) category = document.getElementById('pCategory').value.trim();
      const saleType = document.getElementById('pSaleType').value || 'retail';

      if (!name_km) return alert("សូមបំពេញឈ្មោះភាសាខ្មែរ!");
      if (isNaN(price) || price < 0) return alert("សូមបញ្ចូលតម្លៃឱ្យត្រឹមត្រូវ!");
      if (!category) return alert("សូមជ្រើស ឬវាយប្រភេទទំនិញ!");

      const btn = document.getElementById('saveBtn');
      const oldText = btn.innerText;
      btn.innerText = 'កំពុងរក្សាទុក...'; btn.disabled = true;

      try {
        let imageUrl = '';
        if (selectedFile) {
          btn.innerText = 'កំពុង Upload រូប...';
          try { imageUrl = await uploadToImgBB(selectedFile); }
          catch (uploadErr) {
            console.error(uploadErr);
            alert("⚠️ Upload រូបបរាជ័យ: " + uploadErr.message + "\n\nនឹងរក្សាទុកដោយគ្មានរូប។");
          }
        }
        const data = { name_km, name_en, name_zh, price, discount, stock, barcode, category, saleType, active: true };
        if (editId) {
          if (imageUrl) data.image = imageUrl;
          await updateDoc(doc(db, 'products', editId), data);
          alert("🎉 កែប្រែទំនិញជោគជ័យ!");
        } else {
          data.image = imageUrl || 'https://via.placeholder.com/300?text=No+Image';
          data.createdAt = serverTimestamp();
          await addDoc(collection(db, 'products'), data);
          alert("🎉 បន្ថែមទំនិញជោគជ័យ!");
        }
        cancelEdit();
        switchTab('products');
      } catch (e) {
        console.error(e);
        alert("មានបញ្ហា Firebase: " + (e.code || '') + " " + e.message);
      } finally {
        btn.innerText = oldText; btn.disabled = false;
      }
    };

    window.editProduct = function(id) {
      const p = products.find(x => x.id === id);
      if (!p) return;
      document.getElementById('editId').value = id;
      document.getElementById('pNameKm').value = p.name_km || p.name || '';
      document.getElementById('pNameEn').value = p.name_en || '';
      document.getElementById('pNameZh').value = p.name_zh || '';
      document.getElementById('pPrice').value = p.price || '';
      document.getElementById('pDiscount').value = p.discount || 0;
      document.getElementById('pStock').value = p.stock || 0;
      document.getElementById('pBarcode').value = p.barcode || '';
      document.getElementById('pSaleType').value = p.saleType || 'retail';
      const catSelect = document.getElementById('pCategory');
      const catCustom = document.getElementById('pCategoryCustom');
      const existingCats = Array.from(catSelect.options).map(o => o.value);
      if (p.category && existingCats.includes(p.category)) {
        catSelect.value = p.category; catCustom.value = '';
      } else {
        catSelect.value = ''; catCustom.value = p.category || '';
      }
      document.getElementById('formTitle').innerText = '✏️ កែប្រែទំនិញ';
      document.getElementById('saveBtn').innerText = 'រក្សាទុកការកែប្រែ';
      document.getElementById('cancelBtn').classList.remove('hidden');
      if (p.image) {
        document.getElementById('previewImg').src = p.image;
        document.getElementById('imagePreview').classList.remove('hidden');
      } else {
        document.getElementById('imagePreview').classList.add('hidden');
      }
      selectedFile = null;
      document.getElementById('pImageFile').value = '';
      switchTab('add');
    };

    // ========== BARCODE ==========
    window.startBarcodeScan = function() {
      document.getElementById('scannerModal').classList.remove('hidden');
      document.getElementById('scannerModal').classList.add('flex');
      if (!html5QrCode) html5QrCode = new Html5Qrcode("reader");
      html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 250, height: 150 } },
        (decoded) => {
          document.getElementById('pBarcode').value = decoded;
          stopBarcodeScan();
        },
        () => {}
      ).catch(err => {
        alert('មិនអាចបើកកាមេរ៉ា: ' + err);
        stopBarcodeScan();
      });
    };

    window.stopBarcodeScan = function() {
      if (html5QrCode) {
        html5QrCode.stop().then(() => {
          document.getElementById('scannerModal').classList.add('hidden');
          document.getElementById('scannerModal').classList.remove('flex');
        }).catch(() => {
          document.getElementById('scannerModal').classList.add('hidden');
          document.getElementById('scannerModal').classList.remove('flex');
        });
      } else {
        document.getElementById('scannerModal').classList.add('hidden');
        document.getElementById('scannerModal').classList.remove('flex');
      }
    };

    // ========== FIRESTORE LISTENERS ==========
    onSnapshot(query(collection(db, 'products'), orderBy('createdAt', 'desc')), (snapshot) => {
      products = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
      renderAdminList();
    }, (err) => {
      // fallback without orderBy
      onSnapshot(collection(db, 'products'), (snapshot) => {
        products = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
        renderAdminList();
      });
    });

    onSnapshot(query(collection(db, 'orders'), orderBy('createdAt', 'desc')), (snapshot) => {
      const newOrders = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
      // Detect brand new orders
      if (knownOrderIds.size > 0) {
        const brandNew = newOrders.filter(o => !knownOrderIds.has(o.id) && isPending(o));
        if (brandNew.length > 0) notifyNewOrders(brandNew);
      }
      newOrders.forEach(o => knownOrderIds.add(o.id));
      orders = newOrders;
      renderOrders();
      updatePendingBadge();
    }, (err) => {
      onSnapshot(collection(db, 'orders'), (snapshot) => {
        orders = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
        renderOrders();
        updatePendingBadge();
      });
    });

    // Load KHQR on auth
    onAuthStateChanged(auth, (user) => {
      if (user) loadKhqrSettings();
    });
  </script>
</body>
</html>
